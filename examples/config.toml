[logging]
level = "info"

[paths]
cache = "~/.cache/wau"

[providers.curseforge]
api_key = "your-curseforge-api-key"

[providers.wago]
api_key = "your-wago-api-key"

[providers.github]
api_key = "your-github-api-key"
# handler = "gh"  # optional: use the system `gh` CLI (its own `gh auth login`
# auth) instead of throwing requests directly with `api_key` (the default).
